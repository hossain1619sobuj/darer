<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dazer – ইলেকট্রনিক্স স্টোর</title>
    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a2a6c;
            --accent: #22d3ee;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #0b1a33;
            --text-light: #6b7a93;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --font: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* ---------- হেডার ---------- */
        .header {
            background: linear-gradient(135deg, #0a1628, #1a2a6c);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .logo {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--accent);
        }

        .search-bar {
            flex: 1;
            min-width: 150px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .search-bar input {
            background: transparent;
            border: none;
            padding: 9px 6px;
            color: #fff;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .header-cart-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
        }

        .header-cart-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .cart-badge {
            background: #ef4444;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- কন্টেন্ট ---------- */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 16px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        /* ---------- ফিল্টার বার ---------- */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .category-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
        }

        .cat-chip {
            padding: 5px 14px;
            border-radius: 30px;
            border: 1px solid #dce3ed;
            background: #fff;
            color: #3d4d66;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .cat-chip:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        .cat-chip.active {
            background: var(--primary-light);
            color: #fff;
            border-color: var(--primary-light);
        }

        .sort-select {
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid #dce3ed;
            background: #fff;
            color: #3d4d66;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        /* ---------- প্রোডাক্ট গ্রিড ---------- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 12px;
            box-shadow: var(--shadow);
            border: 1px solid #eef2f8;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(26, 42, 108, 0.12);
            border-color: #cdd9eb;
        }

        .product-card .p-emoji {
            font-size: 2.8rem;
            margin-bottom: 8px;
            background: #f0f5ff;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .product-card .p-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 2px;
        }

        .product-card .p-cat {
            font-size: 0.6rem;
            color: var(--text-light);
            background: #f0f4fc;
            padding: 1px 10px;
            border-radius: 30px;
            margin-bottom: 6px;
        }

        .product-card .p-price {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--primary-light);
            margin-bottom: 8px;
        }

        .product-card .add-btn {
            background: var(--primary-light);
            color: #fff;
            border: none;
            padding: 5px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            max-width: 120px;
        }

        .product-card .add-btn:hover {
            background: #2d4373;
        }

        .product-card .add-btn.in-cart {
            background: #10b981;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 40px 10px;
            grid-column: 1/-1;
        }

        .empty-state .big {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ---------- ক্যাটাগরি ভিউ ---------- */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .category-card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #eef2f8;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(26, 42, 108, 0.1);
        }

        .category-card .c-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 6px;
        }

        .category-card .c-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text);
        }

        /* ---------- অ্যাকাউন্ট ভিউ ---------- */
        .account-placeholder {
            text-align: center;
            padding: 50px 20px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .account-placeholder .a-icon {
            font-size: 4rem;
        }
        .account-placeholder h3 {
            color: var(--text);
            margin: 12px 0 4px;
        }
        .account-placeholder p {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* ---------- বটম নেভিগেশন ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 2px solid #eef2f8;
            display: flex;
            justify-content: space-around;
            z-index: 200;
            padding: 4px 0;
            padding-bottom: env(safe-area-inset-bottom, 4px);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
        }

        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #8a9bb5;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-item .n-icon {
            font-size: 1.3rem;
        }

        .nav-item.active {
            color: var(--primary-light);
        }

        .nav-item.active .n-icon {
            transform: scale(1.1);
        }

        .nav-item:hover {
            color: var(--primary-light);
        }

        /* ---------- কার্ট সাইডবার ---------- */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            z-index: 300;
            display: none;
            justify-content: flex-end;
        }

        .cart-overlay.open {
            display: flex;
        }

        .cart-panel {
            background: #fff;
            width: 400px;
            max-width: 100vw;
            height: 100%;
            padding: 20px 16px;
            overflow-y: auto;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.08);
            animation: slideIn 0.3s;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideIn {
            from { transform: translateX(60px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f4fc;
        }

        .cart-header h3 {
            font-size: 1.2rem;
            color: var(--text);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7a93;
            transition: 0.2s;
        }

        .close-cart:hover {
            color: var(--primary-light);
            transform: rotate(90deg);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f4fc;
        }

        .cart-item .ci-emoji {
            font-size: 1.8rem;
        }
        .cart-item .ci-info {
            flex: 1;
        }
        .cart-item .ci-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }
        .cart-item .ci-price {
            font-size: 0.8rem;
            color: var(--primary-light);
            font-weight: 600;
        }
        .cart-item .ci-qty {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .cart-item .ci-qty button {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #dce3ed;
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .cart-item .ci-qty button:hover {
            background: var(--primary-light);
            color: #fff;
            border-color: var(--primary-light);
        }
        .cart-item .ci-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.5;
            transition: 0.2s;
        }
        .cart-item .ci-remove:hover {
            opacity: 1;
        }

        .cart-total {
            margin-top: auto;
            padding-top: 14px;
            border-top: 2px solid #e9edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }

        .cart-total .total-price {
            color: var(--primary-light);
            font-size: 1.3rem;
        }

        .checkout-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 0.9rem;
        }

        .checkout-btn:hover {
            background: #059669;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-light);
            padding: 30px 0;
        }

        @media (max-width: 500px) {
            .header {
                padding: 10px 12px;
                gap: 8px;
            }
            .logo {
                font-size: 1.1rem;
            }
            .search-bar input {
                font-size: 0.8rem;
                padding: 7px 4px;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .product-card .p-emoji {
                font-size: 2.2rem;
                width: 50px;
                height: 50px;
            }
            .product-card .p-name {
                font-size: 0.75rem;
            }
            .product-card .p-price {
                font-size: 0.9rem;
            }
            .nav-item {
                padding: 5px 10px;
                font-size: 0.65rem;
            }
            .cart-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header class="header">
        <div class="logo">Dazer<span>.</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 পণ্য খুঁজুন..." />
        </div>
        <button class="header-cart-btn" id="cartToggleBtn">
            🛒 <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </header>

    <!-- মেইন -->
    <main class="main" id="mainContent">
        <!-- JS রেন্ডার -->
    </main>

    <!-- বটম নেভিগেশন -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-view="home">
            <span class="n-icon">🏠</span> হোম
        </button>
        <button class="nav-item" data-view="categories">
            <span class="n-icon">📂</span> ক্যাটাগরি
        </button>
        <button class="nav-item" data-view="cart">
            <span class="n-icon">🛒</span> কার্ট
        </button>
        <button class="nav-item" data-view="account">
            <span class="n-icon">👤</span> অ্যাকাউন্ট
        </button>
    </nav>

    <!-- কার্ট সাইডবার -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-panel">
            <div class="cart-header">
                <h3>🛒 আপনার কার্ট</h3>
                <button class="close-cart" id="cartCloseBtn">✕</button>
            </div>
            <div id="cartItemsContainer"></div>
            <div class="cart-total">
                <span>মোট:</span>
                <span class="total-price" id="cartTotal">৳ ০</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">✅ অর্ডার করুন</button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== ডেটা ====================
            const products = [
                { id: 'd1', name: 'স্মার্টফোন', price: 24990, emoji: '📱', category: 'মোবাইল',
                    desc: '৫জি, ১২৮জিবি, অ্যামোলেড ডিসপ্লে' },
                { id: 'd2', name: 'ল্যাপটপ', price: 65990, emoji: '💻', category: 'কম্পিউটার',
                    desc: '১৫.৬" ফুলএইচডি, ৮জিবি র্যাম, ৫১২জিবি এসএসডি' },
                { id: 'd3', name: 'হেডফোন', price: 4590, emoji: '🎧', category: 'অডিও',
                    desc: 'নয়েজ ক্যান্সেলেশন, ব্লুটুথ ৫.৩' },
                { id: 'd4', name: 'স্মার্ট ওয়াচ', price: 12990, emoji: '⌚', category: 'ওয়্যারেবল',
                    desc: 'হার্ট রেট, জিপিএস, জল প্রতিরোধী' },
                { id: 'd5', name: 'ট্যাবলেট', price: 37990, emoji: '📟', category: 'কম্পিউটার',
                    desc: '১০.৪" ডিসপ্লে, পেন সমর্থন' },
                { id: 'd6', name: 'স্পিকার', price: 3290, emoji: '🔊', category: 'অডিও',
                    desc: 'পোর্টেবল, ২০ওয়াট, আইপিএক্স৭' },
                { id: 'd7', name: 'পাওয়ার ব্যাংক', price: 1890, emoji: '🔋', category: 'অ্যাক্সেসরি',
                    desc: '২০০০০এমএএইচ, ফাস্ট চার্জ' },
                { id: 'd8', name: 'ইউএসবি কেবল', price: 490, emoji: '🔌', category: 'অ্যাক্সেসরি',
                    desc: 'টাইপ-সি, ২মি, ব্রেইডেড' },
                { id: 'd9', name: 'ক্যামেরা', price: 52990, emoji: '📷', category: 'ক্যামেরা',
                    desc: '২৪এমপি, ৪কে ভিডিও' },
                { id: 'd10', name: 'মনিটর', price: 18990, emoji: '🖥️', category: 'কম্পিউটার',
                    desc: '২৭" 4K, 60Hz' },
                { id: 'd11', name: 'কিবোর্ড', price: 1990, emoji: '⌨️', category: 'কম্পিউটার',
                    desc: 'মেকানিক্যাল, RGB' },
                { id: 'd12', name: 'মাউস', price: 890, emoji: '🖱️', category: 'কম্পিউটার', desc: 'ওয়্যারলেস' },
            ];

            // ==================== স্টেট ====================
            let currentView = 'home';
            let currentCategory = 'সব';
            let sortBy = 'default';
            let searchQuery = '';
            let cart = JSON.parse(localStorage.getItem('dazer_cart') || '[]');

            // ==================== DOM ====================
            const mainContent = document.getElementById('mainContent');
            const searchInput = document.getElementById('searchInput');
            const cartBadge = document.getElementById('cartBadge');
            const cartOverlay = document.getElementById('cartOverlay');
            const cartItemsContainer = document.getElementById('cartItemsContainer');
            const cartTotal = document.getElementById('cartTotal');
            const cartToggleBtn = document.getElementById('cartToggleBtn');
            const cartCloseBtn = document.getElementById('cartCloseBtn');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const bottomNav = document.getElementById('bottomNav');

            // ==================== হেল্পার ====================
            function getCategories() {
                const cats = new Set(products.map(p => p.category));
                return ['সব', ...cats];
            }

            function getFiltered() {
                let prods = [...products];
                if (currentCategory !== 'সব') {
                    prods = prods.filter(p => p.category === currentCategory);
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    prods = prods.filter(p =>
                        p.name.toLowerCase().includes(q) ||
                        p.category.toLowerCase().includes(q) ||
                        p.desc.toLowerCase().includes(q)
                    );
                }
                if (sortBy === 'price-low') {
                    prods.sort((a, b) => a.price - b.price);
                } else if (sortBy === 'price-high') {
                    prods.sort((a, b) => b.price - a.price);
                }
                return prods;
            }

            function saveCart() {
                localStorage.setItem('dazer_cart', JSON.stringify(cart));
                updateBadge();
            }

            function updateBadge() {
                const count = cart.reduce((s, it) => s + it.qty, 0);
                cartBadge.textContent = count;
            }

            function getCartCount() {
                return cart.reduce((s, it) => s + it.qty, 0);
            }

            function getCartTotal() {
                return cart.reduce((s, it) => s + it.price * it.qty, 0);
            }

            // ==================== রেন্ডার ====================
            function render() {
                switch (currentView) {
                    case 'home':
                        renderHome();
                        break;
                    case 'categories':
                        renderCategories();
                        break;
                    case 'account':
                        renderAccount();
                        break;
                }
                renderCartPanel();
                updateBadge();
                updateNav();
            }

            function updateNav() {
                bottomNav.querySelectorAll('.nav-item').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === currentView);
                });
            }

            function renderHome() {
                const prods = getFiltered();
                let html = `
                    <div class="page-title">🛍️ Dazer <span style="font-size:0.7rem;color:#6b7a93;font-weight:400;">– ইলেকট্রনিক্স</span></div>
                    <p class="page-subtitle">আধুনিক প্রযুক্তি পণ্য সাশ্রয়ী মূল্যে</p>
                    <div class="filter-bar">
                        <div class="category-chips" id="catChips">
                            ${getCategories().map(cat =>
                                `<button class="cat-chip ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
                            ).join('')}
                        </div>
                        <select class="sort-select" id="sortSelect">
                            <option value="default" ${sortBy === 'default' ? 'selected' : ''}>🔄 সাজান</option>
                            <option value="price-low" ${sortBy === 'price-low' ? 'selected' : ''}>দাম কম → বেশি</option>
                            <option value="price-high" ${sortBy === 'price-high' ? 'selected' : ''}>দাম বেশি → কম</option>
                        </select>
                    </div>
                    <div class="product-grid">
                        ${prods.length === 0 ? `
                            <div class="empty-state">
                                <span class="big">🔍</span>
                                <p>কোন পণ্য পাওয়া যায়নি</p>
                            </div>
                        ` : prods.map(p => {
                            const inCart = cart.some(it => it.id === p.id);
                            return `
                                <div class="product-card">
                                    <div class="p-emoji">${p.emoji}</div>
                                    <div class="p-name">${p.name}</div>
                                    <span class="p-cat">${p.category}</span>
                                    <div class="p-price">৳ ${p.price}</div>
                                    <button class="add-btn ${inCart ? 'in-cart' : ''}" data-id="${p.id}">
                                        ${inCart ? '✅ কার্টে আছে' : '🛒 যোগ করুন'}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                mainContent.innerHTML = html;

                // ইভেন্ট
                mainContent.querySelectorAll('.cat-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        currentCategory = chip.dataset.cat;
                        render();
                    });
                });
                mainContent.querySelector('#sortSelect').addEventListener('change', (e) => {
                    sortBy = e.target.value;
                    render();
                });
                mainContent.querySelectorAll('.add-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        toggleCart(btn.dataset.id);
                    });
                });
            }

            function renderCategories() {
                const cats = getCategories().filter(c => c !== 'সব');
                const catIcons = {
                    'মোবাইল': '📱',
                    'কম্পিউটার': '💻',
                    'অডিও': '🎧',
                    'ওয়্যারেবল': '⌚',
                    'অ্যাক্সেসরি': '🔌',
                    'ক্যামেরা': '📷'
                };
                const prods = products;
                let html = `
                    <div class="page-title">📂 ক্যাটাগরি</div>
                    <p class="page-subtitle">বিষয় অনুযায়ী পণ্য দেখুন</p>
                    <div class="category-grid">
                        ${cats.map(cat => {
                            const count = prods.filter(p => p.category === cat).length;
                            return `
                                <div class="category-card" data-cat="${cat}">
                                    <span class="c-icon">${catIcons[cat] || '📦'}</span>
                                    <span class="c-name">${cat} (${count})</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                mainContent.innerHTML = html;
                mainContent.querySelectorAll('.category-card').forEach(card => {
                    card.addEventListener('click', () => {
                        currentCategory = card.dataset.cat;
                        currentView = 'home';
                        render();
                    });
                });
            }

            function renderAccount() {
                mainContent.innerHTML = `
                    <div class="account-placeholder">
                        <div class="a-icon">👤</div>
                        <h3>Dazer অ্যাকাউন্ট</h3>
                        <p>সাইন ইন / রেজিস্টার করুন</p>
                        <p style="margin-top:12px;font-size:0.75rem;">এই ফিচারটি শীঘ্রই আসছে</p>
                    </div>
                `;
            }

            // ==================== কার্ট ====================
            function toggleCart(productId) {
                const idx = cart.findIndex(it => it.id === productId);
                if (idx > -1) {
                    cart.splice(idx, 1);
                } else {
                    const p = products.find(pp => pp.id === productId);
                    if (p) {
                        cart.push({ id: p.id, name: p.name, price: p.price, emoji: p.emoji, qty: 1 });
                    }
                }
                saveCart();
                render();
            }

            function renderCartPanel() {
                cartItemsContainer.innerHTML = '';
                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = `<div class="empty-cart-msg">🛒 কার্ট খালি</div>`;
                    cartTotal.textContent = '৳ ০';
                    return;
                }
                cart.forEach((it, index) => {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <span class="ci-emoji">${it.emoji}</span>
                        <span class="ci-info">
                            <span class="ci-name">${it.name}</span>
                            <span class="ci-price">৳ ${it.price}</span>
                        </span>
                        <span class="ci-qty">
                            <button data-action="dec" data-idx="${index}">−</button>
                            ${it.qty}
                            <button data-action="inc" data-idx="${index}">+</button>
                        </span>
                        <button class="ci-remove" data-action="remove" data-idx="${index}">✕</button>
                    `;
                    div.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const action = btn.dataset.action;
                            const idx = parseInt(btn.dataset.idx);
                            if (action === 'inc') {
                                cart[idx].qty += 1;
                            } else if (action === 'dec') {
                                if (cart[idx].qty > 1) cart[idx].qty -= 1;
                                else cart.splice(idx, 1);
                            } else if (action === 'remove') {
                                cart.splice(idx, 1);
                            }
                            saveCart();
                            render();
                        });
                    });
                    cartItemsContainer.appendChild(div);
                });
                cartTotal.textContent = `৳ ${getCartTotal()}`;
            }

            function openCart() {
                cartOverlay.classList.add('open');
            }

            function closeCart() {
                cartOverlay.classList.remove('open');
            }

            // ==================== ইভেন্ট লিসেনার ====================
            bottomNav.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    if (view === 'cart') {
                        openCart();
                        return;
                    }
                    currentView = view;
                    render();
                });
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            cartToggleBtn.addEventListener('click', openCart);
            cartCloseBtn.addEventListener('click', closeCart);
            cartOverlay.addEventListener('click', (e) => {
                if (e.target === cartOverlay) closeCart();
            });

            checkoutBtn.addEventListener('click', () => {
                if (cart.length === 0) {
                    alert('❌ কার্ট খালি!');
                    return;
                }
                alert(`✅ অর্ডার নিশ্চিত! মোট: ৳ ${getCartTotal()}`);
                cart = [];
                saveCart();
                render();
                closeCart();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && cartOverlay.classList.contains('open')) closeCart();
            });

            // ==================== ইনিশিয়াল ====================
            render();
            updateBadge();
            console.log('🛍️ Dazer স্টোর প্রস্তুত!');
        })();
    </script>
</body>
  </html>
